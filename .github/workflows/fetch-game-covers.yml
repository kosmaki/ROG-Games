name: Fetch real game cover images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-game-covers.yml"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Download real images into the website folder
        id: images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/game-covers

          download_image() {
            local url="$1"
            local base="$2"
            local raw="${base}.download"
            curl -fLsS --retry 3 --retry-delay 2 -A "Mozilla/5.0" "$url" -o "$raw"
            local mime
            mime="$(file --brief --mime-type "$raw")"
            local ext
            case "$mime" in
              image/jpeg) ext="jpg" ;;
              image/png) ext="png" ;;
              image/webp) ext="webp" ;;
              image/gif) ext="gif" ;;
              *) echo "Unexpected image type for $url: $mime" >&2; exit 1 ;;
            esac
            local final="${base}.${ext}"
            mv "$raw" "$final"
            printf '%s' "$final"
          }

          # Official Open Golf App Store screenshots (fallback to its app artwork).
          app_json="$(curl -fLsS --retry 3 'https://itunes.apple.com/lookup?id=1615224465')"
          golf_url="$(printf '%s' "$app_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("results", []); x=r[0] if r else {}; imgs=x.get("screenshotUrls") or []; print(imgs[0] if imgs else x.get("artworkUrl512", ""))')"
          test -n "$golf_url"
          golf_path="$(download_image "$golf_url" "assets/game-covers/open-golf")"

          # Real Space Waves cover from CrazyGames.
          space_path="$(download_image 'https://imgs.crazygames.com/space-waves_16x9/20260330040751/space-waves_16x9-cover?fit=crop&height=630&metadata=none&quality=100&width=1200' 'assets/game-covers/space-waves')"

          # Official Five Nights at Freddy's artwork from Steam.
          freddy_path="$(download_image 'https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/319510/header.jpg?t=1666889251' 'assets/game-covers/five-nights-at-freddys')"

          # Official Minecraft artwork.
          minecraft_path="$(download_image 'https://www.minecraft.net/content/dam/minecraftnet/games/minecraft/key-art/MC_TheGardenAwakens_540x300.jpg' 'assets/game-covers/minecraft-26-2')"

          echo "OPEN_GOLF_PATH=$golf_path" >> "$GITHUB_ENV"
          echo "SPACE_WAVES_PATH=$space_path" >> "$GITHUB_ENV"
          echo "FNAF_PATH=$freddy_path" >> "$GITHUB_ENV"
          echo "MINECRAFT_PATH=$minecraft_path" >> "$GITHUB_ENV"

      - name: Point game cards to downloaded images and remove placeholder artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          index = Path("index.html")
          content = index.read_text(encoding="utf-8")
          replacements = {
              "assets/game-covers/open-golf.svg": os.environ["OPEN_GOLF_PATH"],
              "assets/game-covers/space-waves.svg": os.environ["SPACE_WAVES_PATH"],
              "assets/game-covers/five-nights-at-freddys.svg": os.environ["FNAF_PATH"],
              "assets/game-covers/minecraft-26-2.svg": os.environ["MINECRAFT_PATH"],
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f"Expected old cover reference not found: {old}")
              content = content.replace(old, new)
          index.write_text(content, encoding="utf-8")
          PY
          rm -f assets/game-covers/*.svg
          git add index.html assets/game-covers
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Download real game cover artwork"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
