<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Memory Flip</title><style>html,body{margin:0;height:100%;background:#07070d;color:#e8e8ff;font:600 16px system-ui,sans-serif}body{display:grid;place-items:center;align-content:center;gap:14px}#g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(92vw,440px)}.k{aspect-ratio:1;border:0;border-radius:12px;font-size:clamp(28px,8vw,44px);background:linear-gradient(135deg,#2a2a5a,#14143a);color:transparent;cursor:pointer;box-shadow:0 0 0 1px #6ff3;transition:transform .25s}.k.o{background:#1c2a4a;color:#fff;transform:rotateY(180deg) scaleX(-1)}.k.m{background:#0a4a3a;box-shadow:0 0 14px #0fa}#i{color:#9ff}button.r{padding:10px 20px;border:1px solid #6ff;background:none;color:#6ff;border-radius:8px;cursor:pointer;font:inherit}</style><div id=i></div><div id=g></div><button class=r onclick=init()>New game</button>
<script>
let a,b,moves,left,lock,best=+localStorage.memBest||0;const g=document.getElementById("g"),i=document.getElementById("i");
function init(){const e=[..."🚀🌌👾🎮⚡🔥💎🎯"];const d=[...e,...e].sort(()=>Math.random()-.5);g.innerHTML="";a=b=null;moves=0;left=8;lock=0;d.forEach(v=>{const k=document.createElement("button");k.className="k";k.textContent=v;k.onclick=()=>pick(k);g.appendChild(k)});info()}
function info(){i.textContent="Moves "+moves+(best?"  ·  Best "+best:"")}
function pick(k){if(lock||k.classList.contains("o")||k.classList.contains("m"))return;k.classList.add("o");if(!a){a=k;return}b=k;moves++;info();if(a.textContent==b.textContent){a.classList.add("m");b.classList.add("m");a=b=null;if(!--left){if(!best||moves<best){best=moves;localStorage.memBest=best}i.textContent="Cleared in "+moves+" moves!"}}else{lock=1;setTimeout(()=>{a.classList.remove("o");b.classList.remove("o");a=b=null;lock=0},700)}}
init();
</script>
