<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>T</title><style>html,body{margin:0;height:100%;background:#07070d;color:#e8e8ff;font:600 16px system-ui,sans-serif;overflow:hidden}canvas{display:block;margin:auto;max-width:100%;max-height:100%;touch-action:none}#hud{position:fixed;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;color:#9ff;text-shadow:0 0 8px #0ff}#msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#000a;cursor:pointer;line-height:1.6}#msg b{font-size:30px;color:#0ff}</style><div id=hud><span id=s>Score 0</span><span id=b></span></div><div id=msg><div><b></b><br><span></span></div></div><canvas id=c></canvas>
<script>
document.title="Void Dodger";const c=document.getElementById("c"),x=c.getContext("2d");let W=c.width=Math.min(innerWidth,900),H=c.height=Math.min(innerHeight-6,700);const m=document.getElementById("msg");
let p,rocks=[],t,sc,run=0,keys={},hi=+localStorage.dodgeHi||0,stars=[...Array(60)].map(()=>({x:Math.random()*W,y:Math.random()*H,v:.5+Math.random()*2}));
function show(a,b){m.style.display="grid";m.querySelector("b").textContent=a;m.querySelector("span").innerHTML=b}
function reset(){p={x:W/2,y:H-60};rocks=[];t=0;sc=0;run=1;m.style.display="none";document.getElementById("b").textContent="Best "+hi}
function loop(){x.fillStyle="#07070d";x.fillRect(0,0,W,H);stars.forEach(s=>{s.y+=s.v*(run?1+sc/600:.5);if(s.y>H){s.y=0;s.x=Math.random()*W}x.fillStyle="#fff8";x.fillRect(s.x,s.y,s.v,s.v)});
if(run){t++;sc=t/6|0;const sp=4.5;if(keys.arrowleft||keys.a)p.x-=sp;if(keys.arrowright||keys.d)p.x+=sp;if(keys.arrowup||keys.w)p.y-=sp;if(keys.arrowdown||keys.s)p.y+=sp;p.x=Math.max(14,Math.min(W-14,p.x));p.y=Math.max(14,Math.min(H-14,p.y));
if(t%Math.max(8,35-sc/20|0)==0)rocks.push({x:Math.random()*W,y:-30,r:10+Math.random()*22,v:2+Math.random()*2+sc/120});
rocks.forEach(r=>{r.y+=r.v});rocks=rocks.filter(r=>r.y<H+40);
if(rocks.some(r=>Math.hypot(r.x-p.x,r.y-p.y)<r.r+9)){run=0;if(sc>hi){hi=sc;localStorage.dodgeHi=hi}show("Wrecked","Score "+sc+" · Best "+hi+"<br>Click or press a key");}
document.getElementById("s").textContent="Score "+sc}
x.shadowBlur=12;x.shadowColor="#f55";x.fillStyle="#f66";rocks.forEach(r=>{x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.fill()});
if(p){x.shadowColor="#0ff";x.fillStyle="#6ff";x.beginPath();x.moveTo(p.x,p.y-14);x.lineTo(p.x+11,p.y+11);x.lineTo(p.x-11,p.y+11);x.fill()}x.shadowBlur=0;requestAnimationFrame(loop)}
addEventListener("keydown",e=>{const k=e.key.toLowerCase();keys[k]=1;if(k.startsWith("arrow"))e.preventDefault();if(!run&&k!="escape")reset()});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
function tp(e){if(!run){reset();return}const r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;p.x=(q.clientX-r.left)*W/r.width;p.y=(q.clientY-r.top)*H/r.height-30}
c.addEventListener("touchmove",e=>{e.preventDefault();tp(e)},{passive:false});c.addEventListener("touchstart",tp);m.onclick=()=>{if(!run)reset()};
show("Void Dodger","Arrow keys / WASD or drag to fly<br>Dodge the rocks · click or press a key");loop();
</script>
