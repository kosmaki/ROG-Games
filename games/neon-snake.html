<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>T</title><style>html,body{margin:0;height:100%;background:#07070d;color:#e8e8ff;font:600 16px system-ui,sans-serif;overflow:hidden}canvas{display:block;margin:auto;max-width:100%;max-height:100%;touch-action:none}#hud{position:fixed;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;color:#9ff;text-shadow:0 0 8px #0ff}#msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#000a;cursor:pointer;line-height:1.6}#msg b{font-size:30px;color:#0ff}</style><div id=hud><span id=s>Score 0</span><span id=b></span></div><div id=msg><div><b></b><br><span></span></div></div><canvas id=c></canvas>
<script>
document.title="Neon Snake";const c=document.getElementById("c"),x=c.getContext("2d"),N=20;let S=Math.min(innerWidth,innerHeight-10)|0;c.width=c.height=S;const T=S/N;
let sn,d,nd,f,sc,run,t,hi=+localStorage.snakeHi||0;const m=document.getElementById("msg");
function show(a,b){m.style.display="grid";m.querySelector("b").textContent=a;m.querySelector("span").innerHTML=b}
function reset(){sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];d=nd={x:1,y:0};sc=0;food();run=1;m.style.display="none";document.getElementById("s").textContent="Score 0";document.getElementById("b").textContent="Best "+hi}
function food(){do f={x:Math.random()*N|0,y:Math.random()*N|0};while(sn.some(s=>s.x==f.x&&s.y==f.y))}
function step(){d=nd;const h={x:sn[0].x+d.x,y:sn[0].y+d.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(s=>s.x==h.x&&s.y==h.y)){run=0;if(sc>hi){hi=sc;localStorage.snakeHi=hi}show("Game over","Score "+sc+" · Best "+hi+"<br>Tap or press any key");return}sn.unshift(h);if(h.x==f.x&&h.y==f.y){sc++;document.getElementById("s").textContent="Score "+sc;food()}else sn.pop()}
function draw(){x.fillStyle="#07070d";x.fillRect(0,0,S,S);x.strokeStyle="#ffffff0d";for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*T,0);x.lineTo(i*T,S);x.moveTo(0,i*T);x.lineTo(S,i*T);x.stroke()}
x.shadowBlur=14;x.shadowColor="#f0f";x.fillStyle="#f0f";x.beginPath();x.arc((f.x+.5)*T,(f.y+.5)*T,T*.35,0,7);x.fill();x.shadowColor="#0ff";sn.forEach((s,i)=>{x.fillStyle=i?"#0cc":"#6ff";x.fillRect(s.x*T+2,s.y*T+2,T-4,T-4)});x.shadowBlur=0}
let last=0;function loop(ts){if(run&&ts-last>Math.max(60,130-sc*3)){last=ts;step()}draw();requestAnimationFrame(loop)}
function dir(a,b){if(a!=-d.x||b!=-d.y)nd={x:a,y:b}}
addEventListener("keydown",e=>{const k=e.key.toLowerCase();const M={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(M){e.preventDefault();if(!run)reset();dir(...M)}else if(!run&&k!="escape")reset()});
let tx,ty;addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY});addEventListener("touchend",e=>{if(!run){reset();return}const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;Math.abs(dx)>Math.abs(dy)?dir(dx>0?1:-1,0):dir(0,dy>0?1:-1)});
m.onclick=()=>{if(!run)reset()};sn=[{x:10,y:10}];f={x:5,y:5};d={x:1,y:0};show("Neon Snake","Arrow keys / WASD / swipe<br>Click or press a key to start");requestAnimationFrame(loop);
</script>
