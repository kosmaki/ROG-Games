<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Midnight Keep</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07070d;color:#e8e8ff;font:600 15px system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center}
#top{width:100%;max-width:440px;display:flex;justify-content:space-between;padding:8px 14px;color:#ffd86b;gap:8px}
#top span{background:#ffffff10;border-radius:8px;padding:4px 10px}
#cv{flex:1;min-height:0;width:100%;max-width:440px;touch-action:none}
#bar{width:100%;max-width:440px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
#bar button{border:1px solid #6ff4;background:#14143a;color:#e8e8ff;border-radius:10px;padding:8px 2px;font:inherit;font-size:12px;cursor:pointer;line-height:1.3}
#bar button:disabled{opacity:.4}#bar button b{display:block;color:#ffd86b;font-size:13px}
#msg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;text-align:center;line-height:1.6;padding:20px}
#msg h1{margin:0 0 6px;color:#9d8cff;font-size:30px}#msg button{margin-top:14px;padding:10px 26px;border:0;border-radius:10px;background:#7c5cff;color:#fff;font:inherit;font-size:16px;cursor:pointer}
</style>
<div id=app><div id=top><span id=n>Night 1</span><span id=t>--</span><span id=g>🪙 0</span><span id=d>💎 0</span></div>
<canvas id=cv></canvas>
<div id=bar><button id=b1></button><button id=b2></button><button id=b3></button><button id=b4></button></div></div>
<div id=msg><div><h1>Midnight Keep</h1><div id=mt>Claim a bed, earn gold while you sleep,<br>upgrade your door and torch, and survive until dawn.<br>Reapers hunt the sleepers. Tap an empty room to start.</div><button id=go>Begin</button></div></div>
<script>
const cv=document.getElementById("cv"),x=cv.getContext("2d"),$=id=>document.getElementById(id);
const VW=360,VH=520;let sc=1,ox=0,oy=0;
function fit(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;sc=Math.min(cv.width/VW,cv.height/VH);ox=(cv.width-VW*sc)/2;oy=(cv.height-VH*sc)/2}
addEventListener("resize",fit);
/* rooms: 3 left, 3 right, door faces the hall (x 150..210) */
const rooms=[];for(let i=0;i<6;i++){const L=i<3,y=14+(i%3)*166;rooms.push({x:L?8:212,y,w:140,h:150,door:{x:L?148:212,y:y+55,hp:0,max:0,lvl:0},side:L?1:-1,occ:null,bed:0,torch:0,dead:false})}
let best=+localStorage.keepNight||1,night=1,dia=+localStorage.keepDia||0,gold=0,me=-1,time=0,run=0,over=0,reapers=[],tick=0,mode="pick";
const fmt=n=>n>=1000?(n/1000).toFixed(1)+"k":Math.floor(n);
function setup(){gold=40+night*10;me=-1;mode="pick";time=75;reapers=[];over=0;
 rooms.forEach(r=>{r.occ=null;r.bed=0;r.torch=0;r.dead=false;r.door.lvl=0;r.door.max=r.door.hp=90+night*15});
 const idx=[0,1,2,3,4,5].sort(()=>Math.random()-.5);idx.slice(0,3).forEach(i=>rooms[i].occ={npc:1,sleep:Math.random()*6});
 $("n").textContent="Night "+night;ui()}
function spawn(){const r={x:180,y:-20,hp:0,max:140+night*55,t:null,state:"walk",fl:0,atk:0,wait:0};r.hp=r.max;reapers.push(r)}
function pickTarget(r){const c=rooms.map((q,i)=>i).filter(i=>rooms[i].occ&&!rooms[i].dead);if(!c.length){r.t=null;return}
 /* the reaper prefers weaker doors */c.sort((a,b)=>rooms[a].door.hp-rooms[b].door.hp);r.t=Math.random()<.5?c[0]:c[Math.random()*c.length|0];r.state="walk"}
const cost={bed:r=>Math.round(30*Math.pow(1.55,r.bed)),door:r=>Math.round(40*Math.pow(1.6,r.door.lvl)),torch:r=>Math.round(70*Math.pow(1.7,r.torch)),rep:r=>Math.ceil((r.door.max-r.door.hp)*.5)};
function ui(){const r=rooms[me];const b=[$("b1"),$("b2"),$("b3"),$("b4")];
 if(!r||!r.occ||r.occ.npc){b.forEach(e=>{e.disabled=true;e.innerHTML="—"});return}
 const c=[["🛏️ Bed","Lv"+r.bed,cost.bed(r)],["🚪 Door","Lv"+r.door.lvl,cost.door(r)],["🔦 Torch","Lv"+r.torch,cost.torch(r)],["🔧 Repair",Math.floor(r.door.hp)+"/"+r.door.max,cost.rep(r)]];
 c.forEach((v,i)=>{b[i].innerHTML=v[0]+" "+v[1]+"<b>🪙 "+v[2]+"</b>";b[i].disabled=gold<v[2]||(i==3&&r.door.hp>=r.door.max)||over||!run})}
function buy(i){const r=rooms[me];if(!r||over||!run)return;const c=[cost.bed,cost.door,cost.torch,cost.rep][i](r);if(gold<c)return;if(i==3&&r.door.hp>=r.door.max)return;gold-=c;
 if(i==0)r.bed++;else if(i==1){r.door.lvl++;r.door.max+=70;r.door.hp+=70}else if(i==2)r.torch++;else r.door.hp=r.door.max;ui()}
[0,1,2,3].forEach(i=>$("b"+(i+1)).onclick=()=>buy(i));
function pickRoom(i){if(mode!="pick"||rooms[i].occ)return;me=i;rooms[i].occ={npc:0};mode="play";run=1;ui()}
function end(win){over=1;run=0;const m=$("msg");m.style.display="grid";
 if(win){night++;dia+=3;if(night>best){best=night;localStorage.keepNight=best}localStorage.keepDia=dia;gold+=0;
  m.querySelector("h1").textContent="Dawn!";$("mt").innerHTML="You survived the night. 💎 +3<br>Next: Night "+night;$("go").textContent="Next night"}
 else{dia+=1;localStorage.keepDia=dia;m.querySelector("h1").textContent="Caught";$("mt").innerHTML="A reaper found you on night "+night+". 💎 +1<br>Best night: "+best;$("go").textContent="Try again";night=Math.max(1,night)}
 $("d").textContent="💎 "+dia}
$("go").onclick=()=>{$("msg").style.display="none";setup()};
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect(),d=devicePixelRatio||1,px=((e.clientX-r.left)*d-ox)/sc,py=((e.clientY-r.top)*d-oy)/sc;
 rooms.forEach((q,i)=>{if(px>q.x&&px<q.x+q.w&&py>q.y&&py<q.y+q.h)pickRoom(i)})});
addEventListener("keydown",e=>{const k=e.key;if("1234".includes(k)&&k.length==1)buy(+k-1)});
function update(dt){if(!run)return;time-=dt;tick+=dt;
 const M=rooms[me];
 rooms.forEach(r=>{if(r.occ&&!r.dead){if(r.occ.npc){r.occ.sleep-=dt}}});
 if(tick>=1){tick=0;if(M&&!M.dead)gold+=2+M.bed*2.5;ui()}
 const want=Math.min(4,1+(night>>1))-reapers.length;
 if(want>0&&Math.random()<dt*.35&&time<72)spawn();
 reapers.forEach(r=>{
  if(r.state=="flee"){r.y-=90*dt;r.wait-=dt;if(r.y<-40){r.hp=r.max;r.state="walk";r.x=180;r.y=-20;r.t=null}return}
  if(r.t==null||!rooms[r.t].occ||rooms[r.t].dead){pickTarget(r);if(r.t==null)return}
  const q=rooms[r.t],dx=180+(q.side>0?-22:22),dy=q.door.y+10;
  if(r.state=="walk"){const sx=dx-r.x,sy=dy-r.y,d=Math.hypot(sx,sy),sp=48+night*3;if(d<4)r.state="hit";else{r.x+=sx/d*sp*dt;r.y+=sy/d*sp*dt}}
  if(r.state=="hit"){r.fl=(r.fl||0)+dt;const dmg=(10+night*3.5)*dt;
   if(q.door.hp>0){q.door.hp-=dmg;if(q.torch&&!q.occ.npc){r.hp-=q.torch*7*dt}else if(q.occ.npc){r.hp-=3*dt}
    if(q.door.hp<=0){q.door.hp=0;r.state="in";r.atk=2.2}
    if(r.hp<=0){r.state="flee";r.wait=8}}}
  else if(r.state=="in"){r.atk-=dt;if(q.torch&&!q.occ.npc)r.hp-=q.torch*7*dt;if(r.hp<=0){r.state="flee";r.wait=8;return}
   if(r.atk<=0){q.dead=true;q.occ.dead=true;if(rooms[me]===q){end(false)}else{r.t=null;r.state="walk"}}}
 });
 if(!over&&time<=0)end(true);
 $("t").textContent=Math.max(0,time|0)+"s";$("g").textContent="🪙 "+fmt(gold)}
function draw(){x.setTransform(1,0,0,1,0,0);x.fillStyle="#07070d";x.fillRect(0,0,cv.width,cv.height);x.setTransform(sc,0,0,sc,ox,oy);
 x.fillStyle="#12122a";x.fillRect(150,0,60,VH);x.fillStyle="#ffffff08";for(let i=0;i<VH;i+=40)x.fillRect(176,i,8,20);
 rooms.forEach((r,i)=>{x.fillStyle=r.occ&&!r.occ.npc?"#241b4a":"#1a1a38";x.fillRect(r.x,r.y,r.w,r.h);x.strokeStyle=i==me?"#9d8cff":"#3a3a6a";x.lineWidth=i==me?3:2;x.strokeRect(r.x,r.y,r.w,r.h);
  const bx=r.x+(r.side>0?16:r.w-60),by=r.y+22;
  if(r.dead){x.fillStyle="#400";x.fillRect(bx,by,44,70);x.fillStyle="#f66";x.font="22px serif";x.fillText("💀",bx+8,by+42)}
  else if(r.occ){x.fillStyle="#2e4a8a";x.fillRect(bx,by,44,70);x.fillStyle="#d8d8ff";x.fillRect(bx+4,by+4,36,16);x.fillStyle=r.occ.npc?"#8a8aa8":"#ffd86b";x.beginPath();x.arc(bx+22,by+36,10,0,7);x.fill();x.fillStyle="#9ff";x.font="11px system-ui";x.fillText(r.occ.npc?"zzz":"you",bx+8,by+62)}
  else{x.fillStyle="#2a2a50";x.fillRect(bx,by,44,70);x.fillStyle="#9d8cff";x.font="12px system-ui";x.fillText(mode=="pick"?"tap":"empty",bx+9,by+38)}
  if(r.occ){const d=r.door,w=10,h=44;x.fillStyle=d.hp>0?"#8a5a2a":"#222";x.fillRect(r.side>0?r.x+r.w-w/2-2:r.x-w/2+2,d.y,w,h);
   if(!r.dead){x.fillStyle="#400";x.fillRect(r.x+r.w/2-35,r.y+r.h-14,70,6);x.fillStyle="#4f8";x.fillRect(r.x+r.w/2-35,r.y+r.h-14,70*Math.max(0,d.hp)/d.max,6)}
   if(r.torch&&!r.occ.npc){x.font="14px serif";x.fillText("🔦",r.side>0?r.x+r.w-26:r.x+8,r.y+18)}}});
 reapers.forEach(r=>{const a=r.state=="flee"?.4:1;x.globalAlpha=a;x.shadowBlur=16;x.shadowColor="#f0f";x.fillStyle="#1a0a2a";x.beginPath();x.moveTo(r.x,r.y-16);x.lineTo(r.x+13,r.y+14);x.lineTo(r.x-13,r.y+14);x.fill();x.fillStyle="#f33";x.fillRect(r.x-5,r.y-5,3,3);x.fillRect(r.x+2,r.y-5,3,3);x.shadowBlur=0;
  x.fillStyle="#400";x.fillRect(r.x-14,r.y-26,28,4);x.fillStyle="#f55";x.fillRect(r.x-14,r.y-26,28*Math.max(0,r.hp)/r.max,4);x.globalAlpha=1});
 if(mode=="pick"){x.fillStyle="#fffd";x.font="13px system-ui";x.textAlign="center";x.fillText("Tap an empty room to claim it",180,VH-6);x.textAlign="left"}}
let last=performance.now();function loop(n){const dt=Math.min(.1,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
window.G={rooms,get reapers(){return reapers},set gold(v){gold=v},set time(v){time=v},pickRoom,buy,get over(){return over}};
fit();setup();$("d").textContent="💎 "+dia;requestAnimationFrame(loop);
</script>
