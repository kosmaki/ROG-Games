<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>T</title><style>html,body{margin:0;height:100%;background:#07070d;color:#e8e8ff;font:600 16px system-ui,sans-serif;overflow:hidden}canvas{display:block;margin:auto;max-width:100%;max-height:100%;touch-action:none}#hud{position:fixed;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;color:#9ff;text-shadow:0 0 8px #0ff}#msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#000a;cursor:pointer;line-height:1.6}#msg b{font-size:30px;color:#0ff}</style><div id=hud><span id=s>Score 0</span><span id=b></span></div><div id=msg><div><b></b><br><span></span></div></div><canvas id=c></canvas>
<script>
document.title="Brick Breaker";const c=document.getElementById("c"),x=c.getContext("2d");const W=c.width=Math.min(innerWidth,720),H=c.height=Math.min(innerHeight-6,560);const m=document.getElementById("msg");
let pad,ball,br,sc,lv,lives,run=0,keys={},hi=+localStorage.brickHi||0;
function show(a,b){m.style.display="grid";m.querySelector("b").textContent=a;m.querySelector("span").innerHTML=b}
function level(){br=[];const rows=3+Math.min(lv,5),cols=10,w=W/cols;for(let r=0;r<rows;r++)for(let i=0;i<cols;i++)br.push({x:i*w+2,y:50+r*24,w:w-4,h:20,c:"hsl("+(r*50+lv*30)+",90%,60%)"});serve()}
function serve(){pad={x:W/2-45,w:90};ball={x:W/2,y:H-60,vx:3.2*(Math.random()<.5?-1:1),vy:-(4+lv*.4),r:7}}
function reset(){sc=0;lv=1;lives=3;run=1;m.style.display="none";level();document.getElementById("b").textContent="Best "+hi}
function end(t){run=0;if(sc>hi){hi=sc;localStorage.brickHi=hi}show(t,"Score "+sc+" · Best "+hi+"<br>Click or press a key")}
function loop(){x.fillStyle="#07070d";x.fillRect(0,0,W,H);
if(run){if(keys.arrowleft||keys.a)pad.x-=7;if(keys.arrowright||keys.d)pad.x+=7;pad.x=Math.max(0,Math.min(W-pad.w,pad.x));
ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r||ball.x>W-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy*=-1;
if(ball.vy>0&&ball.y>H-26-ball.r&&ball.y<H-14&&ball.x>pad.x&&ball.x<pad.x+pad.w){ball.vy=-Math.abs(ball.vy);ball.vx=((ball.x-pad.x)/pad.w-.5)*9}
for(const b of br){if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y-ball.r&&ball.y<b.y+b.h+ball.r){b.dead=1;ball.vy*=-1;sc+=10;break}}br=br.filter(b=>!b.dead);
if(!br.length){lv++;level()}
if(ball.y>H+10){lives--;if(lives<=0)end("Game over");else serve()}
document.getElementById("s").textContent="Score "+sc+"  ·  Lives "+lives+"  ·  Level "+lv}
if(br)br.forEach(b=>{x.fillStyle=b.c;x.fillRect(b.x,b.y,b.w,b.h)});
if(pad){x.shadowBlur=12;x.shadowColor="#0ff";x.fillStyle="#6ff";x.fillRect(pad.x,H-26,pad.w,12);x.shadowColor="#fff";x.fillStyle="#fff";x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();x.shadowBlur=0}
requestAnimationFrame(loop)}
addEventListener("keydown",e=>{const k=e.key.toLowerCase();keys[k]=1;if(k.startsWith("arrow"))e.preventDefault();if(!run&&k!="escape")reset()});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
function mv(e){if(!run){return}const r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;pad.x=(q.clientX-r.left)*W/r.width-pad.w/2}
c.addEventListener("mousemove",mv);c.addEventListener("touchmove",e=>{e.preventDefault();mv(e)},{passive:false});m.onclick=()=>{if(!run)reset()};
show("Brick Breaker","Mouse / touch / ← → to move<br>Click or press a key");loop();
</script>
